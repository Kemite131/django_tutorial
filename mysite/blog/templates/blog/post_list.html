<html>
    <head>
        <title>Django Girls blog</title>
    </head>
    <body>
        <h1>My Django Blog</h1>

        {% for post in posts %}
            <article>
                <h2>{{ post.title }}</h2>
                <p>{{ post.text|linebreaksbr }}</p>
            </article>
        {% endfor %}
    </body>
</html>
